retrieval:
  enabled: true
  top_k: 5
  use_reranker: true
  initial_top_k: 20
prompt:
  strict_mode: true
refuse_gate:
  enabled: true
  # Preliminary empirical defaults. The originally planned 0.5 / 0.05 threshold
  # was too strict for the current score distribution and caused over-refusal.
  # Recalibrate after the formal 25-question evaluation set is available.
  max_threshold: 0.3
  spread_threshold: 0.0
consistency_check:
  enabled: true
llm:
  model: "qwen-plus"
  temperature: 0
